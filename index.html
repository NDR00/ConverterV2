<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quick Converter</title>

    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#1976d2">

    <style>
        :root {
            --primary: #1976d2;
            --primary-light: #e3f2fd;
            --bg: #f5f6f8;
            --card-bg: #ffffff;
            --text: #212121;
            --text-sub: #555555;
            --border: #cccccc;
        }

        body.dark-mode {
            --primary: #90caf9;
            --primary-light: #1a2736;
            --bg: #121212;
            --card-bg: #1e1e1e;
            --text: #e0e0e0;
            --text-sub: #aaaaaa;
            --border: #3d3d3d;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Sarabun", "Noto Sans Thai", Helvetica, Arial, sans-serif;
            padding: 8px;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            user-select: none;
        }

        .card {
            background: var(--card-bg);
            padding: 12px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            border: 1px solid var(--border);
            max-width: 520px;
            margin: 0 auto;
        }

        /* Top Bar */
        .top-row {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 8px;
        }

        .search-box {
            flex: 1;
            padding: 7px 10px;
            font-size: 13px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--bg);
            color: var(--text);
        }

        .menu-btn {
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 6px 9px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
        }

        /* Category Tabs */
        .tabs {
            display: flex;
            gap: 4px;
            overflow-x: auto;
            padding-bottom: 6px;
            margin-bottom: 8px;
            scrollbar-width: none;
        }
        .tabs::-webkit-scrollbar { display: none; }

        .tab-btn {
            background: var(--bg);
            border: 1px solid var(--border);
            padding: 5px 10px;
            border-radius: 14px;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-sub);
            white-space: nowrap;
            cursor: pointer;
            flex-shrink: 0;
        }

        .tab-btn.active {
            background: var(--primary);
            color: #ffffff;
            border-color: var(--primary);
        }

        body.dark-mode .tab-btn.active {
            color: #121212;
        }

        /* Primary Output Box */
        .result-box {
            background: var(--primary-light);
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 8px;
            border: 1px solid var(--border);
        }

        .result-val {
            font-size: 22px;
            font-weight: 800;
            color: var(--primary);
            line-height: 1.2;
            word-break: break-word;
        }

        body.dark-mode .result-val {
            color: #90caf9;
        }

        .tape-fraction {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-sub);
            margin-top: 2px;
        }

        .action-row {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 6px;
        }

        .btn-action {
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
        }

        /* Form Controls */
        .input-row {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 6px;
            margin-bottom: 6px;
        }

        .control-grid {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 6px;
            align-items: center;
            margin-bottom: 6px;
        }

        label {
            font-size: 10px;
            font-weight: 700;
            color: var(--text-sub);
            text-transform: uppercase;
            display: block;
            margin-bottom: 2px;
        }

        input, select {
            width: 100%;
            padding: 8px;
            font-size: 14px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--card-bg);
            color: var(--text);
            height: 40px;
        }

        .swap-btn {
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 50%;
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            cursor: pointer;
            margin-top: 14px;
        }

        /* Collapsible Log */
        details {
            margin-top: 6px;
            border-top: 1px solid var(--border);
            padding-top: 6px;
        }

        summary {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-sub);
            cursor: pointer;
            outline: none;
        }

        .history-list {
            list-style: none;
            padding: 0;
            margin: 6px 0 0 0;
            max-height: 110px;
            overflow-y: auto;
        }

        .history-item {
            font-size: 12px;
            padding: 4px 6px;
            border-bottom: 1px dotted var(--border);
            display: flex;
            justify-content: space-between;
        }

        .hint {
            font-size: 11px;
            color: var(--text-sub);
            margin-top: 6px;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="card">
    <!-- Top Bar with Search, Language Toggle, and Theme Toggle -->
    <div class="top-row">
        <input type="text" class="search-box" id="quickSearch" placeholder="🔍 Search unit / ค้นหาหน่วย..." oninput="handleSearch()">
        <button class="menu-btn" id="langToggle" onclick="toggleLanguage()">ไทย</button>
        <button class="menu-btn" id="themeToggle" onclick="toggleTheme()">Theme</button>
    </div>

    <!-- Category Tabs -->
    <div class="tabs" id="categoryTabs"></div>

    <!-- Pinned Top Result Display -->
    <div class="result-box">
        <div class="result-val" id="outputVal">--</div>
        <div class="tape-fraction" id="tapeFraction"></div>
        <div class="action-row">
            <button class="btn-action" id="btnCopy" onclick="copyResult()">📋 Copy</button>
            <button class="btn-action" id="btnLog" onclick="logToHistory()">💾 Log</button>
        </div>
    </div>

    <!-- Amount & Precision Row -->
    <div class="input-row">
        <div>
            <label for="inputVal" id="labelAmount">Amount (Fractions: 1/8, 5 1/2)</label>
            <input type="text" id="inputVal" value="1" oninput="convert()">
        </div>
        <div>
            <label for="precisionSelect" id="labelDecimals">Decimals</label>
            <select id="precisionSelect" onchange="convert()">
                <option value="0">0</option>
                <option value="2" selected>2</option>
                <option value="4">4</option>
            </select>
        </div>
    </div>

    <!-- From / Swap / To Units Grid -->
    <div class="control-grid">
        <div>
            <label for="fromUnit" id="labelFrom">From</label>
            <select id="fromUnit" onchange="convert()"></select>
        </div>

        <button class="swap-btn" onclick="swapUnits()" title="Swap Units">⇄</button>

        <div>
            <label for="toUnit" id="labelTo">To</label>
            <select id="toUnit" onchange="convert()"></select>
        </div>
    </div>

    <div class="hint" id="hintText">Fractions like 1/8, 3/4, or 5 1/2 are supported.</div>

    <!-- History Log -->
    <details>
        <summary id="summaryHistory">View History Log</summary>
        <ul class="history-list" id="historyList">
            <li class="history-item" id="emptyHistoryMsg" style="color: var(--text-sub);">No entries logged yet.</li>
        </ul>
    </details>
</div>

    let currentCategory = "tape";
    let lastFormattedResult = "";
    let historyEntries = [];

    function renderUI() {
        const s = UI_STRINGS[currentLang];
        document.getElementById('quickSearch').placeholder = s.searchPlaceholder;
        document.getElementById('langToggle').innerText = currentLang === 'en' ? 'ไทย' : 'English';
        document.getElementById('btnCopy').innerText = s.copy;
        document.getElementById('btnLog').innerText = s.log;
        document.getElementById('labelAmount').innerText = s.amount;
        document.getElementById('labelDecimals').innerText = s.decimals;
        document.getElementById('labelFrom').innerText = s.from;
        document.getElementById('labelTo').innerText = s.to;
        document.getElementById('hintText').innerText = s.hint;
        document.getElementById('summaryHistory').innerText = s.historyTitle;

        // Render Category Tabs
        const tabsContainer = document.getElementById('categoryTabs');
        tabsContainer.innerHTML = '';
        for (let catKey in categories) {
            const btn = document.createElement('button');
            btn.className = 'tab-btn' + (catKey === currentCategory ? ' active' : '');
            btn.id = `tab-${catKey}`;
            btn.innerText = categories[catKey].title[currentLang];
            btn.onclick = function() { setCategory(catKey, this); };
            tabsContainer.appendChild(btn);
        }

        populateDropdowns();
        convert();
        renderHistory();
    }

    function toggleLanguage() {
        currentLang = currentLang === 'en' ? 'th' : 'en';
        localStorage.setItem('lang', currentLang);
        renderUI();
    }

    function parseFraction(str) {
        if (!str) return NaN;
        str = str.trim();
        if (str.includes(' ')) {
            let parts = str.split(' ');
            let whole = parseFloat(parts[0]);
            let fracParts = parts[1].split('/');
            if (fracParts.length === 2) {
                return whole + (parseFloat(fracParts[0]) / parseFloat(fracParts[1]));
            }
        } else if (str.includes('/')) {
            let parts = str.split('/');
            if (parts.length === 2) {
                return parseFloat(parts[0]) / parseFloat(parts[1]);
            }
        }
        return parseFloat(str);
    }

    function toTapeFraction(valInches) {
        if (isNaN(valInches) || valInches < 0) return "";
        let whole = Math.floor(valInches);
        let remainder = valInches - whole;
        let sixteenths = Math.round(remainder * 16);

        if (sixteenths === 16) { whole += 1; sixteenths = 0; }
        const s = UI_STRINGS[currentLang];
        if (sixteenths === 0) return whole > 0 ? `${s.exactPrefix}${whole}")` : "";

        let num = sixteenths;
        let den = 16;
        while (num % 2 === 0 && den % 2 === 0) { num /= 2; den /= 2; }
        let fracStr = whole > 0 ? `${whole} ${num}/${den}"` : `${num}/${den}"`;
        return `${s.tapePrefix}${fracStr}`;
    }

    function populateDropdowns() {
        const cat = categories[currentCategory];
        const fromSelect = document.getElementById('fromUnit');
        const toSelect = document.getElementById('toUnit');
        const prevFrom = fromSelect.value || cat.defaultFrom;
        const prevTo = toSelect.value || cat.defaultTo;

        fromSelect.innerHTML = '';
        toSelect.innerHTML = '';

        for (let key in cat.units) {
            const unitLabel = cat.units[key].name[currentLang];
            fromSelect.options.add(new Option(unitLabel, key));
            toSelect.options.add(new Option(unitLabel, key));
        }

        fromSelect.value = cat.units[prevFrom] ? prevFrom : cat.defaultFrom;
        toSelect.value = cat.units[prevTo] ? prevTo : cat.defaultTo;
    }

    function setCategory(catKey, element) {
        currentCategory = catKey;
        const buttons = document.querySelectorAll('.tab-btn');
        buttons.forEach(btn => btn.classList.remove('active'));
        if (element) {
            element.classList.add('active');
            element.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
        }
        populateDropdowns();
        convert();
    }

    function swapUnits() {
        const fromSelect = document.getElementById('fromUnit');
        const toSelect = document.getElementById('toUnit');
        const temp = fromSelect.value;
        fromSelect.value = toSelect.value;
        toSelect.value = temp;
        convert();
    }

    function convert() {
        const inputRaw = document.getElementById('inputVal').value;
        const val = parseFraction(inputRaw);
        const from = document.getElementById('fromUnit').value;
        const to = document.getElementById('toUnit').value;
        const outBox = document.getElementById('outputVal');
        const fracBox = document.getElementById('tapeFraction');
        const precision = parseInt(document.getElementById('precisionSelect').value);

        fracBox.innerText = "";

        if (isNaN(val) || !from || !to) {
            outBox.innerText = "--";
            lastFormattedResult = "";
            return;
        }

        let result = 0;

        if (currentCategory === "temp") {
            if (from === "f" && to === "c") result = (val - 32) * 5 / 9;
            else if (from === "c" && to === "f") result = (val * 9 / 5) + 32;
            else result = val;
        } 
        else if (currentCategory === "fuel") {
            let mpgVal = val;
            if (from === "kml") mpgVal = val * 2.35215;
            else if (from === "l100km") mpgVal = 235.215 / val;

            if (to === "mpg") result = mpgVal;
            else if (to === "kml") result = mpgVal / 2.35215;
            else if (to === "l100km") result = 235.215 / mpgVal;
        } 
        else {
            const catUnits = categories[currentCategory].units;
            const baseValue = val * catUnits[from].baseRatio;
            result = baseValue / catUnits[to].baseRatio;
        }

        const formatted = result.toFixed(precision);
        const unitName = categories[currentCategory].units[to].name[currentLang].split('(')[0].trim();
        lastFormattedResult = `${formatted} ${unitName}`;
        outBox.innerText = lastFormattedResult;

        if (to === "in") {
            fracBox.innerText = toTapeFraction(result);
        }
    }

    function copyResult() {
        if (!lastFormattedResult) return;
        navigator.clipboard.writeText(lastFormattedResult).then(() => {
            const outBox = document.getElementById('outputVal');
            const original = outBox.innerText;
            outBox.innerText = UI_STRINGS[currentLang].copied;
            setTimeout(() => { outBox.innerText = original; }, 900);
        });
    }

    function logToHistory() {
        if (!lastFormattedResult) return;
        const inputVal = document.getElementById('inputVal').value;
        const fromName = categories[currentCategory].units[document.getElementById('fromUnit').value].name[currentLang].split('(')[0].trim();
        const entry = `${inputVal} ${fromName} → ${lastFormattedResult}`;

        historyEntries.unshift(entry);
        if (historyEntries.length > 5) historyEntries.pop();
        renderHistory();
    }

    function renderHistory() {
        const list = document.getElementById('historyList');
        if (historyEntries.length === 0) {
            list.innerHTML = `<li class="history-item" style="color: var(--text-sub);">${UI_STRINGS[currentLang].historyEmpty}</li>`;
            return;
        }
        list.innerHTML = historyEntries.map(item => `<li class="history-item"><span>${item}</span></li>`).join('');
    }

    function toggleTheme() {
        document.body.classList.toggle('dark-mode');
        const isDark = document.body.classList.contains('dark-mode');
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
    }

    function handleSearch() {
        const query = document.getElementById('quickSearch').value.toLowerCase().trim();
        if (!query) return;

        for (let catKey in categories) {
            for (let unitKey in categories[catKey].units) {
                const enName = categories[catKey].units[unitKey].name.en.toLowerCase();
                const thName = categories[catKey].units[unitKey].name.th.toLowerCase();
                if (enName.includes(query) || thName.includes(query) || unitKey.toLowerCase() === query) {
                    setCategory(catKey, document.getElementById(`tab-${catKey}`));
                    document.getElementById('fromUnit').value = unitKey;
                    convert();
                    return;
                }
            }
        }
    }

    window.onload = function() {
        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-mode');
        }
        renderUI();
    };
</script>
</body>
</html>
