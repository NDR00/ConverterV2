<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quick Converter</title>

    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#1976d2">

    <style>
        :root {
            --primary: #1976d2;
            --primary-light: #e3f2fd;
            --bg: #f5f6f8;
            --card-bg: #ffffff;
            --text: #212121;
            --text-sub: #555555;
            --border: #cccccc;
        }

        body.dark-mode {
            --primary: #90caf9;
            --primary-light: #1a2736;
            --bg: #121212;
            --card-bg: #1e1e1e;
            --text: #e0e0e0;
            --text-sub: #aaaaaa;
            --border: #3d3d3d;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding: 8px;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            user-select: none;
        }

        .card {
            background: var(--card-bg);
            padding: 12px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            border: 1px solid var(--border);
            max-width: 520px;
            margin: 0 auto;
        }

        /* Top Bar */
        .top-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }

        .search-box {
            flex: 1;
            padding: 7px 10px;
            font-size: 13px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--bg);
            color: var(--text);
        }

        .theme-btn {
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
        }

        /* Category Tabs */
        .tabs {
            display: flex;
            gap: 4px;
            overflow-x: auto;
            padding-bottom: 6px;
            margin-bottom: 8px;
            scrollbar-width: none;
        }
        .tabs::-webkit-scrollbar { display: none; }

        .tab-btn {
            background: var(--bg);
            border: 1px solid var(--border);
            padding: 5px 10px;
            border-radius: 14px;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-sub);
            white-space: nowrap;
            cursor: pointer;
            flex-shrink: 0;
        }

        .tab-btn.active {
            background: var(--primary);
            color: #ffffff;
            border-color: var(--primary);
        }

        body.dark-mode .tab-btn.active {
            color: #121212;
        }

        /* Primary Output Box (At Top for Zero Scroll) */
        .result-box {
            background: var(--primary-light);
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 8px;
            border: 1px solid var(--border);
        }

        .result-val {
            font-size: 22px;
            font-weight: 800;
            color: var(--primary);
            line-height: 1.2;
            word-break: break-word;
        }

        body.dark-mode .result-val {
            color: #90caf9;
        }

        .tape-fraction {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-sub);
            margin-top: 2px;
        }

        .action-row {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 6px;
        }

        .btn-action {
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
        }

        /* Compact Grid Controls */
        .control-grid {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 6px;
            align-items: center;
            margin-bottom: 6px;
        }

        .input-row {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 6px;
            margin-bottom: 6px;
        }

        label {
            font-size: 10px;
            font-weight: 700;
            color: var(--text-sub);
            text-transform: uppercase;
            display: block;
            margin-bottom: 2px;
        }

        input, select {
            width: 100%;
            padding: 8px;
            font-size: 15px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--card-bg);
            color: var(--text);
            height: 40px;
        }

        .swap-btn {
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 50%;
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            cursor: pointer;
            margin-top: 14px;
        }

        /* Collapsible Log */
        details {
            margin-top: 6px;
            border-top: 1px solid var(--border);
            padding-top: 6px;
        }

        summary {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-sub);
            cursor: pointer;
            outline: none;
        }

        .history-list {
            list-style: none;
            padding: 0;
            margin: 6px 0 0 0;
            max-height: 110px;
            overflow-y: auto;
        }

        .history-item {
            font-size: 12px;
            padding: 4px 6px;
            border-bottom: 1px dotted var(--border);
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>
<body>

<div class="card">
    <!-- Top Bar -->
    <div class="top-row">
        <input type="text" class="search-box" id="quickSearch" placeholder="🔍 Search unit (e.g. rai, psi, gpm, oz)..." oninput="handleSearch()">
        <button class="theme-btn" id="themeToggle" onclick="toggleTheme()">Theme</button>
    </div>

    <!-- Category Tabs -->
    <div class="tabs" id="categoryTabs">
        <button class="tab-btn active" id="tab-tape" onclick="setCategory('tape', this)">Tape</button>
        <button class="tab-btn" id="tab-weight" onclick="setCategory('weight', this)">Weight & Gold</button>
        <button class="tab-btn" id="tab-area" onclick="setCategory('area', this)">Area/Land</button>
        <button class="tab-btn" id="tab-cooking" onclick="setCategory('cooking', this)">Cooking Spoons</button>
        <button class="tab-btn" id="tab-materials" onclick="setCategory('materials', this)">Materials</button>
        <button class="tab-btn" id="tab-water" onclick="setCategory('water', this)">Water/Pump</button>
        <button class="tab-btn" id="tab-electrical" onclick="setCategory('electrical', this)">Solar/Battery</button>
        <button class="tab-btn" id="tab-volume" onclick="setCategory('volume', this)">Volume</button>
        <button class="tab-btn" id="tab-pressure" onclick="setCategory('pressure', this)">Pressure/Torque</button>
        <button class="tab-btn" id="tab-fuel" onclick="setCategory('fuel', this)">Fuel</button>
        <button class="tab-btn" id="tab-speed" onclick="setCategory('speed', this)">Speed</button>
        <button class="tab-btn" id="tab-distance" onclick="setCategory('distance', this)">Distance</button>
        <button class="tab-btn" id="tab-temp" onclick="setCategory('temp', this)">Temp</button>
        <button class="tab-btn" id="tab-data" onclick="setCategory('data', this)">Data</button>
    </div>

    <!-- Pinned Top Result Display -->
    <div class="result-box">
        <div class="result-val" id="outputVal">--</div>
        <div class="tape-fraction" id="tapeFraction"></div>
        <div class="action-row">
            <button class="btn-action" onclick="copyResult()">📋 Copy</button>
            <button class="btn-action" onclick="logToHistory()">💾 Log</button>
        </div>
    </div>

    <!-- Amount & Precision Row -->
    <div class="input-row">
        <div>
            <label for="inputVal">Amount (Fractions ok: 1/8, 5 1/2)</label>
            <input type="text" id="inputVal" value="1" oninput="convert()">
        </div>
        <div>
            <label for="precisionSelect">Decimals</label>
            <select id="precisionSelect" onchange="convert()">
                <option value="0">0</option>
                <option value="2" selected>2</option>
                <option value="4">4</option>
            </select>
        </div>
    </div>

    <!-- From / Swap / To Units Grid -->
    <div class="control-grid">
        <div>
            <label for="fromUnit">From</label>
            <select id="fromUnit" onchange="convert()"></select>
        </div>

        <button class="swap-btn" onclick="swapUnits()" title="Swap Units">⇄</button>

        <div>
            <label for="toUnit">To</label>
            <select id="toUnit" onchange="convert()"></select>
        </div>
    </div>

    <!-- Compact Expandable History -->
    <details>
        <summary>View History Log</summary>
        <ul class="history-list" id="historyList">
            <li class="history-item" style="color: var(--text-sub);">No entries logged yet.</li>
        </ul>
    </details>
</div>

<script>
    const categories = {
        tape: {
            units: {
                in: { name: "Inches (in)", baseRatio: 1 },
                mm: { name: "Millimeters (mm)", baseRatio: 0.0393701 },
                cm: { name: "Centimeters (cm)", baseRatio: 0.393701 },
                ft: { name: "Feet (ft)", baseRatio: 12 },
                m:  { name: "Meters (m)", baseRatio: 39.3701 },
                yd: { name: "Yards (yd)", baseRatio: 36 }
            },
            defaultFrom: "in",
            defaultTo: "mm"
        },
        weight: {
            units: {
                lb:          { name: "Pounds (lbs)", baseRatio: 1 },
                kg:          { name: "Kilograms (kg)", baseRatio: 2.20462 },
                oz:          { name: "Ounces (oz)", baseRatio: 0.0625 },
                g:           { name: "Grams (g)", baseRatio: 0.00220462 },
                troy_oz:     { name: "99.999% Fine Gold (Troy Oz)", baseRatio: 0.0685714 },
                gold_orn:    { name: "Thai Gold Baht - Jewelry (15.16g)", baseRatio: 0.033422 },
                gold_bar:    { name: "Thai Gold Baht - Bar (15.244g)", baseRatio: 0.033607 }
            },
            defaultFrom: "gold_bar",
            defaultTo: "g"
        },
        area: {
            units: {
                sqft: { name: "Sq Feet (sq ft)", baseRatio: 1 },
                sqm:  { name: "Sq Meters (sq m)", baseRatio: 10.7639 },
                rai:  { name: "Rai (ไร่ - 1600m²)", baseRatio: 17222.3 },
                ngan: { name: "Ngan (งาน - 400m²)", baseRatio: 4305.56 },
                wah:  { name: "Sq Wah (4m²)", baseRatio: 43.0556 },
                acre: { name: "Acres", baseRatio: 43560 },
                ha:   { name: "Hectares", baseRatio: 107639 }
            },
            defaultFrom: "rai",
            defaultTo: "sqm"
        },
        cooking: {
            units: {
                tsp:   { name: "Teaspoon (tsp)", baseRatio: 1 },
                tbsp:  { name: "Tablespoon (tbsp)", baseRatio: 3 },
                dstsp: { name: "Dessertspoon (2 tsp)", baseRatio: 2 },
                dram:  { name: "Fluid Dram (3/4 tsp)", baseRatio: 0.75 },
                dash:  { name: "Dash (1/8 tsp)", baseRatio: 0.125 },
                pinch: { name: "Pinch (1/16 tsp)", baseRatio: 0.0625 },
                drop:  { name: "Drop (1/64 tsp)", baseRatio: 0.015625 },
                cup:   { name: "Cups (US)", baseRatio: 48 },
                ml:    { name: "Milliliters (mL)", baseRatio: 0.202884 },
                floz:  { name: "Fluid Oz (fl oz)", baseRatio: 6 }
            },
            defaultFrom: "tbsp",
            defaultTo: "tsp"
        },
        materials: {
            units: {
                bdft: { name: "Board Feet", baseRatio: 1 },
                cuft: { name: "Cubic Feet (ft³)", baseRatio: 12 },
                cuyd: { name: "Cubic Yards (yd³)", baseRatio: 324 },
                cum:  { name: "Cubic Meters (m³)", baseRatio: 423.776 }
            },
            defaultFrom: "cuyd",
            defaultTo: "cum"
        },
        water: {
            units: {
                gpm:  { name: "Gallons/Min (GPM)", baseRatio: 1 },
                lmin: { name: "Liters/Min (L/min)", baseRatio: 0.264172 },
                lsec: { name: "Liters/Sec (L/s)", baseRatio: 15.8503 },
                psi:  { name: "Head Pressure (PSI)", baseRatio: 1 },
                mhead:{ name: "Meters Head", baseRatio: 1.42233 }
            },
            defaultFrom: "gpm",
            defaultTo: "lmin"
        },
        electrical: {
            units: {
                kwh:  { name: "Kilowatt-Hours (kWh)", baseRatio: 1 },
                ah12: { name: "Amp-Hours @ 12V", baseRatio: 0.012 },
                ah24: { name: "Amp-Hours @ 24V", baseRatio: 0.024 },
                ah48: { name: "Amp-Hours @ 48V", baseRatio: 0.048 },
                wh:   { name: "Watt-Hours (Wh)", baseRatio: 0.001 }
            },
            defaultFrom: "kwh",
            defaultTo: "ah48"
        },
        volume: {
            units: {
                gal:  { name: "Gallons (US)", baseRatio: 1 },
                l:    { name: "Liters (L)", baseRatio: 0.264172 },
                floz: { name: "Fluid Oz (fl oz)", baseRatio: 0.0078125 },
                ml:   { name: "Milliliters (mL)", baseRatio: 0.000264172 }
            },
            defaultFrom: "gal",
            defaultTo: "l"
        },
        pressure: {
            units: {
                psi:  { name: "PSI", baseRatio: 1 },
                bar:  { name: "Bar", baseRatio: 14.5038 },
                kpa:  { name: "kPa", baseRatio: 0.145038 },
                ftlb: { name: "Ft-Lbs (Torque)", baseRatio: 1 },
                nm:   { name: "N·m (Torque)", baseRatio: 0.737562 }
            },
            defaultFrom: "psi",
            defaultTo: "bar"
        },
        fuel: {
            units: {
                mpg:    { name: "US MPG" },
                kml:    { name: "Km/Liter" },
                l100km: { name: "L/100km" }
            },
            defaultFrom: "mpg",
            defaultTo: "kml"
        },
        speed: {
            units: {
                mph: { name: "MPH", baseRatio: 1 },
                kph: { name: "Km/h", baseRatio: 0.621371 }
            },
            defaultFrom: "mph",
            defaultTo: "kph"
        },
        distance: {
            units: {
                mi: { name: "Miles", baseRatio: 1 },
                km: { name: "Kilometers", baseRatio: 0.621371 }
            },
            defaultFrom: "mi",
            defaultTo: "km"
        },
        temp: {
            units: {
                f: { name: "Fahrenheit (°F)" },
                c: { name: "Celsius (°C)" }
            },
            defaultFrom: "f",
            defaultTo: "c"
        },
        data: {
            units: {
                mbps: { name: "Mbps (Internet)", baseRatio: 1 },
                mbs:  { name: "MB/s (Download)", baseRatio: 8 },
                gb:   { name: "Gigabytes (GB)", baseRatio: 8000 },
                tb:   { name: "Terabytes (TB)", baseRatio: 8000000 }
            },
            defaultFrom: "mbps",
            defaultTo: "mbs"
        }
    };

    let currentCategory = "tape";
    let lastFormattedResult = "";
    let historyEntries = [];

    function parseFraction(str) {
        if (!str) return NaN;
        str = str.trim();
        if (str.includes(' ')) {
            let parts = str.split(' ');
            let whole = parseFloat(parts[0]);
            let fracParts = parts[1].split('/');
            if (fracParts.length === 2) {
                return whole + (parseFloat(fracParts[0]) / parseFloat(fracParts[1]));
            }
        } else if (str.includes('/')) {
            let parts = str.split('/');
            if (parts.length === 2) {
                return parseFloat(parts[0]) / parseFloat(parts[1]);
            }
        }
        return parseFloat(str);
    }

    function toTapeFraction(valInches) {
        if (isNaN(valInches) || valInches < 0) return "";
        let whole = Math.floor(valInches);
        let remainder = valInches - whole;
        let sixteenths = Math.round(remainder * 16);

        if (sixteenths === 16) { whole += 1; sixteenths = 0; }
        if (sixteenths === 0) return whole > 0 ? `(Exact: ${whole}")` : "";

        let num = sixteenths;
        let den = 16;
        while (num % 2 === 0 && den % 2 === 0) { num /= 2; den /= 2; }
        let fracStr = whole > 0 ? `${whole} ${num}/${den}"` : `${num}/${den}"`;
        return `≈ Tape: ${fracStr}`;
    }

    function setCategory(catKey, element) {
        currentCategory = catKey;

        const buttons = document.querySelectorAll('.tab-btn');
        buttons.forEach(btn => btn.classList.remove('active'));
        if (element) {
            element.classList.add('active');
            element.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
        }

        const cat = categories[catKey];
        const fromSelect = document.getElementById('fromUnit');
        const toSelect = document.getElementById('toUnit');

        fromSelect.innerHTML = '';
        toSelect.innerHTML = '';

        for (let key in cat.units) {
            fromSelect.options.add(new Option(cat.units[key].name, key));
            toSelect.options.add(new Option(cat.units[key].name, key));
        }

        fromSelect.value = cat.defaultFrom;
        toSelect.value = cat.defaultTo;

        convert();
    }

    function swapUnits() {
        const fromSelect = document.getElementById('fromUnit');
        const toSelect = document.getElementById('toUnit');
        const temp = fromSelect.value;
        fromSelect.value = toSelect.value;
        toSelect.value = temp;
        convert();
    }

    function convert() {
        const inputRaw = document.getElementById('inputVal').value;
        const val = parseFraction(inputRaw);
        const from = document.getElementById('fromUnit').value;
        const to = document.getElementById('toUnit').value;
        const outBox = document.getElementById('outputVal');
        const fracBox = document.getElementById('tapeFraction');
        const precision = parseInt(document.getElementById('precisionSelect').value);

        fracBox.innerText = "";

        if (isNaN(val) || !from || !to) {
            outBox.innerText = "--";
            lastFormattedResult = "";
            return;
        }

        let result = 0;

        if (currentCategory === "temp") {
            if (from === "f" && to === "c") result = (val - 32) * 5 / 9;
            else if (from === "c" && to === "f") result = (val * 9 / 5) + 32;
            else result = val;
        } 
        else if (currentCategory === "fuel") {
            let mpgVal = val;
            if (from === "kml") mpgVal = val * 2.35215;
            else if (from === "l100km") mpgVal = 235.215 / val;

            if (to === "mpg") result = mpgVal;
            else if (to === "kml") result = mpgVal / 2.35215;
            else if (to === "l100km") result = 235.215 / mpgVal;
        } 
        else {
            const catUnits = categories[currentCategory].units;
            const baseValue = val * catUnits[from].baseRatio;
            result = baseValue / catUnits[to].baseRatio;
        }

        const formatted = result.toFixed(precision);
        const unitName = categories[currentCategory].units[to].name.split('(')[0].trim();
        lastFormattedResult = `${formatted} ${unitName}`;
        outBox.innerText = lastFormattedResult;

        if (to === "in") {
            fracBox.innerText = toTapeFraction(result);
        }
    }

    function copyResult() {
        if (!lastFormattedResult) return;
        navigator.clipboard.writeText(lastFormattedResult).then(() => {
            const outBox = document.getElementById('outputVal');
            const original = outBox.innerText;
            outBox.innerText = "Copied!";
            setTimeout(() => { outBox.innerText = original; }, 900);
        });
    }

    function logToHistory() {
        if (!lastFormattedResult) return;
        const inputVal = document.getElementById('inputVal').value;
        const fromName = categories[currentCategory].units[document.getElementById('fromUnit').value].name.split('(')[0].trim();
        const entry = `${inputVal} ${fromName} → ${lastFormattedResult}`;

        historyEntries.unshift(entry);
        if (historyEntries.length > 5) historyEntries.pop();
        renderHistory();
    }

    function renderHistory() {
        const list = document.getElementById('historyList');
        if (historyEntries.length === 0) {
            list.innerHTML = '<li class="history-item" style="color: var(--text-sub);">No entries logged yet.</li>';
            return;
        }
        list.innerHTML = historyEntries.map(item => `<li class="history-item"><span>${item}</span></li>`).join('');
    }

    function toggleTheme() {
        document.body.classList.toggle('dark-mode');
        const isDark = document.body.classList.contains('dark-mode');
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
    }

    function handleSearch() {
        const query = document.getElementById('quickSearch').value.toLowerCase().trim();
        if (!query) return;

        for (let catKey in categories) {
            for (let unitKey in categories[catKey].units) {
                const uName = categories[catKey].units[unitKey].name.toLowerCase();
                if (uName.includes(query) || unitKey.toLowerCase() === query) {
                    const tabBtn = document.getElementById(`tab-${catKey}`);
                    setCategory(catKey, tabBtn);
                    document.getElementById('fromUnit').value = unitKey;
                    convert();
                    return;
                }
            }
        }
    }

    window.onload = function() {
        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-mode');
        }
        setCategory('tape', document.getElementById('tab-tape'));
    };
</script>
</body>
</html>
